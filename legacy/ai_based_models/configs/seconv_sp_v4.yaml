# v4: v3 ile aynı (kanal bazlı gürültü/maske, 64x64, seed, val ile en iyi epoch) + kosinüs öğrenme oranı azaltımı
model_name: seconv_unet
model_tag: SeConvUNet
use_mask_channel: true
ckpt_path: ../weights/seconv_unet_sp_v4.pth

train_dir: ../../tiny-imagenet-200/train
val_dir: ../../tiny-imagenet-200/val/images
val_count: 500
seed: 0
epochs: 30
batch_size: 64
lr: 1e-4
lr_schedule: cosine
patch: 64
num_workers: 4
mask_loss_weight: 6.0

noisy_root: ../../Tiny-Imagenet
out_root: ../../Tiny-Imagenet
